defaults:
  - dataset: scannet
  - splits: scannet_all

seq_name: scene0011_00
debug: True
project_root: /root/autodl-tmp/3DMap
data_root: /root/autodl-tmp/scannet
device: gpu

hydra:
  job:
    chdir: True
  run:
    dir: ${project_root}/outputs/scannet_outputs

# =========================
# OpenAI / LLM Configuration
# =========================

# !!! IMPORTANT !!!
# Replace this with YOUR OWN OpenAI-compatible API key.
# DO NOT commit real API keys to public repositories.
OPENAI_KEY: sk-your-own-openai-api-key-here

# Base URL for the OpenAI-compatible API endpoint
# Example below uses Alibaba DashScope OpenAI-compatible mode
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# Name of the language model to use
model: deepseek-v3
